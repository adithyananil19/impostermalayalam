<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1c2419" />
      <stop offset="100%" stop-color="#0d0f0d" />
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGlow)" stroke="#222820" stroke-width="2" />
  
  <!-- Outer subtle ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#c6f36a" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="6 4" />
  
  <!-- Stylized Imposter Eye / Mask -->
  <path d="M52 96 C68 70, 124 70, 140 96 C124 122, 68 122, 52 96 Z" fill="#141814" stroke="#c6f36a" stroke-width="3.5" filter="url(#neon)" />
  
  <!-- Glowing Center Iris -->
  <circle cx="96" cy="96" r="16" fill="#c6f36a" />
  <circle cx="96" cy="96" r="7" fill="#0d0f0d" />
  
  <!-- Top decorative dot -->
  <circle cx="96" cy="52" r="3" fill="#c6f36a" opacity="0.8" />
</svg>