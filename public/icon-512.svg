  <line x1="256" y1="120" x2="256" y2="148" stroke="#c6f36a" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="256" y1="364" x2="256" y2="392" stroke="#c6f36a" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="100" y1="256" x2="128" y2="256" stroke="#c6f36a" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="384" y1="256" x2="412" y2="256" stroke="#c6f36a" stroke-width="3" opacity="0.7" stroke-linecap="round" />
