<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow512" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1e281a" />
      <stop offset="100%" stop-color="#0d0f0d" />
    </radialGradient>
    <filter id="neon512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow512)" stroke="#262f23" stroke-width="4" />
  
  <!-- Outer subtle tech rings -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#c6f36a" stroke-width="3" stroke-opacity="0.14" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#c6f36a" stroke-width="1.5" stroke-opacity="0.08" />
  
  <!-- Stylized Imposter Eye / Mask -->
  <path d="M138 256 C182 184, 330 184, 374 256 C330 328, 182 328, 138 256 Z" fill="#141814" stroke="#c6f36a" stroke-width="9" filter="url(#neon512)" />
  
  <!-- Glowing Center Iris -->
